<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razor Community | Inscrição</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .subscribe-page{min-height:100vh;display:grid;place-items:center;padding:40px 0}.subscribe-panel{width:min(620px,100%);padding:40px;background:#111317;border:1px solid #30352c;border-radius:14px;text-align:center}.subscribe-panel h1{font-size:36px;letter-spacing:-1.5px;margin:16px 0}.subscribe-panel h1 span{color:#d8f64b}.subscribe-panel p{color:#9299a3;font-size:13px;line-height:1.8;margin-bottom:26px}.youtube-box{background:#08090b;border:1px solid #30343a;border-radius:10px;padding:30px 25px;margin:20px 0;display:grid;place-items:center}.youtube-icon{font-size:42px;margin-bottom:12px}.youtube-subscribe-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;background:#ff0033;color:#fff;border:0;border-radius:6px;padding:16px 26px;font-size:13px;font-weight:900;cursor:pointer;text-decoration:none;transition:transform .2s,filter .2s}.youtube-subscribe-button:hover{filter:brightness(1.12);transform:translateY(-2px)}.youtube-subscribe-button .play{font-size:18px}.notice{font-size:10px!important;color:#737b85!important;margin-top:15px}
  </style>
</head>
<body>
  <main class="subscribe-page container">
    <section class="subscribe-panel">
      <span class="eyebrow">/// RAZOR COMMUNITY</span>
      <h1>Inscreva-se no <span>canal.</span></h1>
      <p>Inscreva-se no canal oficial da comunidade e acompanhe as novidades e recursos autorizados.</p>

      <div class="youtube-box">
        <div class="youtube-icon">▶</div>
        <h3>Canal oficial Gabhriel Ribeiro</h3>
        <a class="youtube-subscribe-button" href="https://www.youtube.com/@GabhrielRib%C3%AAiro?sub_confirmation=1" target="_blank" rel="noopener noreferrer">
          <span class="play">▶</span> Inscrever-se no YouTube
        </a>
      </div>

      <p class="notice">O botão abre a confirmação de inscrição do YouTube em uma nova aba.</p>
    </section>
  </main>
</body>
</html>
