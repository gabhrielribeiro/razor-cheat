<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razor Community | Inscrição</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .subscribe-page{min-height:100vh;display:grid;place-items:center;padding:40px 0}.subscribe-panel{width:min(620px,100%);padding:40px;background:#111317;border:1px solid #30352c;border-radius:14px;text-align:center}.subscribe-panel h1{font-size:36px;letter-spacing:-1.5px;margin:16px 0}.subscribe-panel h1 span{color:#d8f64b}.subscribe-panel p{color:#9299a3;font-size:13px;line-height:1.8;margin-bottom:26px}.youtube-box{background:#08090b;border:1px solid #30343a;border-radius:10px;padding:25px;margin:20px 0;min-height:74px;display:grid;place-items:center}.release-button{display:inline-block;margin-top:22px;background:#d8f64b;color:#10120b;border:0;border-radius:6px;padding:14px 20px;font-size:11px;font-weight:900;cursor:pointer}.notice{font-size:10px!important;color:#737b85!important;margin-top:15px}
  </style>
</head>
<body>
  <main class="subscribe-page container">
    <section class="subscribe-panel">
      <span class="eyebrow">/// RAZOR COMMUNITY</span>
      <h1>Inscreva-se no <span>canal.</span></h1>
      <p>Inscreva-se no canal oficial da comunidade e acompanhe as novidades e recursos autorizados.</p>

      <div class="youtube-box">
        <div class="g-ytsubscribe" data-channel="devryze07" data-layout="full" data-count="default"></div>
      </div>

      <a class="release-button" href="https://www.youtube.com/@devryze07?sub_confirmation=1" target="_blank" rel="noopener noreferrer">Inscrever-se no YouTube →</a>
      <p class="notice">O botão abre o canal oficial. A inscrição não é validada automaticamente pelo site.</p>
    </section>
  </main>

  <script src="https://apis.google.com/js/platform.js"></script>
</body>
</html>
